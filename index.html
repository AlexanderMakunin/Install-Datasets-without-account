
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kaggle Direct Download</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1118;
      --panel: #141e29;
      --border: #2b3948;
      --green: #b9f36a;
      --text: #f4f7fa;
      --muted: #a5b2c0;
      --red: #ff8585;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 system-ui, sans-serif;
    }

    main {
      width: 100%;
      max-width: 580px;
      padding: 32px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 20px 70px #0004;
    }

    .brand {
      color: var(--green);
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .14em;
    }

    h1 {
      margin: 14px 0 8px;
      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1.1;
      letter-spacing: -.04em;
    }

    p { color: var(--muted); }

    label {
      display: block;
      margin: 24px 0 8px;
      font-weight: 650;
    }

    input {
      display: block;
      width: 100%;
      padding: 15px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: var(--green);
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: var(--green);
      color: #17220e;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover { background: #d0ffa0; }

    #status {
      margin-top: 18px;
      font-size: .92rem;
      overflow-wrap: anywhere;
    }

    #status.error { color: var(--red); }
    #status.success { color: var(--green); }

    .hint {
      margin-top: 22px;
      font-size: .82rem;
    }

    @media (max-width: 480px) {
      main { padding: 22px; }
    }
  </style>
</head>

<body>
  <main>
    <div class="brand">KAGGLE / DIRECT DOWNLOAD</div>

    <h1>Tu dataset.<br>Directo a tu equipo.</h1>

    <p>
      Pega el enlace de un dataset público de Kaggle.
      Generaremos el enlace de descarga y abriremos una
      pestaña para descargar el ZIP.
    </p>

    <form id="downloadForm">
      <label for="datasetUrl">URL del dataset</label>

      <input
        id="datasetUrl"
        type="url"
        placeholder="https://www.kaggle.com/datasets/usuario/dataset"
        autocomplete="url"
        required
      >

      <button type="submit">Validar y descargar ZIP ↓</button>
    </form>

    <div id="status" role="status" aria-live="polite"></div>

    <p class="hint">
      Solo se aceptan enlaces de datasets de Kaggle.
      No introduzcas contraseñas ni claves API.
    </p>
  </main>

  <script>
    const form = document.getElementById("downloadForm");
    const input = document.getElementById("datasetUrl");
    const status = document.getElementById("status");

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      status.className = "";
      status.textContent = "";

      let url;

      try {
        url = new URL(input.value.trim());
      } catch {
        return showError("Introduce una URL válida.");
      }

      // Aceptar únicamente dominios oficiales de Kaggle.
      if (
        url.protocol !== "https:" ||
        !["kaggle.com", "www.kaggle.com"].includes(url.hostname) ||
        url.username ||
        url.password
      ) {
        return showError(
          "El enlace debe pertenecer a https://www.kaggle.com/"
        );
      }

      // Formato esperado: /datasets/propietario/nombre
      const parts = url.pathname.split("/").filter(Boolean);

      if (
        parts[0] !== "datasets" ||
        !parts[1] ||
        !parts[2] ||
        ["list", "view", "download"].includes(parts[1])
      ) {
        return showError(
          "Usa un enlace como kaggle.com/datasets/usuario/dataset"
        );
      }

      const owner = parts[1];
      const slug = parts[2];

      // Evitar identificadores inesperados.
      const validId = /^[a-zA-Z0-9_-]+$/;

      if (!validId.test(owner) || !validId.test(slug)) {
        return showError("El propietario o nombre del dataset no es válido.");
      }

      const downloadUrl =
        "https://www.kaggle.com/api/v1/datasets/download/" +
        encodeURIComponent(owner) + "/" +
        encodeURIComponent(slug);

      status.className = "success";
      status.textContent =
        "Enlace válido. Abriendo la descarga de " +
        owner + "/" + slug + "...";

      // Se ejecuta directamente tras el clic del usuario
      // para reducir el riesgo de bloqueo de ventanas emergentes.
      window.open(downloadUrl, "_blank", "noopener,noreferrer");
    });

    function showError(message) {
      status.className = "error";
      status.textContent = message;
    }
  </script>
</body>
</html>
